<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>Anmeldung · passport.io Admin</title>
  <style>body{font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;color:#0a0d0c}</style>
</head>
<body>
  <p id="msg">Anmeldung wird abgeschlossen …</p>
  <script>
    // Übergibt das GitHub-Token an den Admin-Bereich (Decap CMS) im ursprünglichen Fenster.
    (function () {
      var p = new URLSearchParams(location.hash.slice(1));
      history.replaceState(null, "", location.pathname); // Token aus der Adresszeile entfernen
      var ok = p.get("token");
      var msg = ok ? "authorization:github:success:" + JSON.stringify({ token: ok, provider: "github" })
                   : "authorization:github:error:" + JSON.stringify({ message: p.get("error") || "unbekannt" });
      if (!window.opener) { document.getElementById("msg").textContent = "Bitte den Admin-Bereich neu öffnen."; return; }
      window.addEventListener("message", function receive(e) {
        if (e.origin !== location.origin) return;
        window.opener.postMessage(msg, location.origin);
        window.removeEventListener("message", receive);
        setTimeout(function () { window.close(); }, 300);
      });
      window.opener.postMessage("authorizing:github", location.origin);
      document.getElementById("msg").textContent = ok ? "Angemeldet – dieses Fenster schließt sich." : "Anmeldung fehlgeschlagen.";
    })();
  </script>
</body>
</html>
