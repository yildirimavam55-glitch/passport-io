# ==========================================================================
# passport.io – Redaktionsoberfläche (Decap CMS)
# Lokal testen:   node server.js   und   npx decap-server   ->  http://localhost:5173/admin/
# Online: Anmeldung mit GitHub über die Supabase-Funktion cms-auth (siehe ANLEITUNG.md → „Start-Checkliste“).
# Bearbeiten kann, wer im GitHub-Repository Schreibrechte hat. Jede Änderung wird automatisch veröffentlicht.
# ==========================================================================

backend:
  name: github
  repo: yildirimavam55-glitch/passport-io
  branch: main
  base_url: https://sbzwibctxezprpefwxzn.supabase.co
  auth_endpoint: functions/v1/cms-auth
  commit_messages:
    create: "Inhalt: {{collection}} „{{slug}}“ angelegt"
    update: "Inhalt: {{collection}} „{{slug}}“ geändert"
    delete: "Inhalt: {{collection}} „{{slug}}“ gelöscht"

local_backend: true
locale: de

# Mehrsprachigkeit: alle Sprachen liegen in derselben Datei ({ "tr": …, "en": …, "de": … }).
# Türkisch ist die Hauptsprache und enthält Bilder, Links, Preise-Schlüssel usw.; andere Sprachen nur die Texte.
i18n:
  structure: single_file
  locales: [tr, en, de, ar, ru, fr, es]
  default_locale: tr
site_url: /
display_url: /

media_folder: img/uploads
public_folder: img/uploads

collections:
  # ------------------------------------------------------------------------
  - name: seiten
    i18n: true
    label: Startseite
    editor: { preview: false }
    files:
      - name: site
        label: Startseite & Design
        file: content/site.json
        i18n: true
        fields:
          - label: Markenfarben
            name: theme
            widget: object
            collapsed: true
            fields:
              - { label: Akzentfarbe (Grün), name: green, widget: color }
              - { label: Dunkle Farbe, name: dark, widget: color }

          - label: Preis-Schnittstelle
            name: api
            widget: object
            i18n: true
            collapsed: true
            hint: "Alle Preise der Seite kommen von hier. Lokal: api/prices.json (Testdaten). Live: Adresse des Preis-Proxys, z. B. /.netlify/functions/prices"
            fields:
              - { label: Adresse, name: pricesUrl, widget: string }
              - { label: "Adresse für unbeantwortete Lina-Fragen (Supabase)", name: questionsUrl, widget: string, required: false }
              - { label: "Text, wenn kein Preis verfügbar", name: unavailableText, widget: string, i18n: true }
              - { label: "Hinweis im Paketfenster, wenn keine Preise verfügbar", name: modalUnavailableText, widget: text, i18n: true }

          - label: Vorschau-Hinweis
            name: preview
            widget: object
            i18n: true
            collapsed: true
            hint: "Gelber Hinweis oben auf der Seite. Vor dem Livegang ausschalten (wenn echte Preise und Trustpilot angebunden sind)."
            fields:
              - { label: Anzeigen, name: enabled, widget: boolean }
              - { label: Text, name: text, widget: string, i18n: true }

          - label: Marke
            name: brand
            widget: object
            collapsed: true
            fields:
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Endung, name: suffix, widget: string, i18n: true }

          - label: Ankündigungsleiste (ganz oben)
            name: announcement
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Anzeigen, name: enabled, widget: boolean, default: false }
              - { label: Text, name: text, widget: string, i18n: true }
              - { label: Link, name: link, widget: string, required: false }

          - label: Aufbau der Startseite
            name: sections
            widget: list
            hint: "Reihenfolge per Ziehen ändern. Bereiche mit dem Schalter ein- oder ausblenden."
            summary: "{{fields.type}} {{fields.enabled}}"
            fields:
              - label: Bereich
                name: type
                widget: select
                options:
                  - { label: "Startbild (Hero)", value: hero }
                  - { label: "Beliebte Reiseziele", value: destinations }
                  - { label: "Regionale & globale Pakete", value: packages }
                  - { label: "Was ist eine eSIM?", value: howto }
                  - { label: "Lounge & Fast Track", value: airport }
                  - { label: "Bewertungen", value: reviews }
                  - { label: "Digitaler Assistent & FAQ", value: assistant }
                  - { label: "Magazin / Blog", value: blog }
                  - { label: "Newsletter", value: newsletter }
              - { label: Sichtbar, name: enabled, widget: boolean, default: true }

          - label: Menü
            name: nav
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Text, name: label, widget: string, i18n: true }
              - { label: Link, name: url, widget: string }
              - { label: Kennzeichen (z. B. „bald“), name: badge, widget: string, required: false, i18n: true }

          - label: "Bereich: Startbild (Hero)"
            name: hero
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, hint: "Preise nur als Platzhalter: {preis:esim}, {preis:lounge}, {preis:fasttrack}, {preis:country:tr}", i18n: true }
              - { label: Unterzeile, name: subtitle, widget: string, hint: "Preise nur als Platzhalter, z. B. „Ab {preis:esim}, in zwei Minuten aktiv.“", i18n: true }
              - { label: Hintergrundbild, name: image, widget: image, choose_url: true }
              - { label: Platzhalter im Suchfeld, name: searchPlaceholder, widget: string, i18n: true }
              - { label: Such-Button, name: searchButton, widget: string, i18n: true }
              - label: Vertrauens-Punkte
                name: facts
                widget: list
                i18n: true
                summary: "{{fields.text}}"
                fields:
                  - label: Symbol
                    name: icon
                    widget: select
                    options:
                      - { label: Trustpilot-Stern, value: trustpilot }
                      - { label: E-Mail, value: mail }
                      - { label: Schild, value: shield }
                      - { label: Haken, value: check }
                  - { label: Text, name: text, widget: string, i18n: true }
              - { label: Text vor den Zahlungslogos, name: paymentsLabel, widget: string, required: false, i18n: true }
              - label: Zahlungslogos im Startbild
                name: payments
                widget: select
                multiple: true
                required: false
                options: &payments
                  - { label: Apple Pay, value: applepay }
                  - { label: Google Pay, value: googlepay }
                  - { label: Klarna, value: klarna }
                  - { label: PayPal, value: paypal }
                  - { label: Visa, value: visa }
                  - { label: Mastercard, value: mastercard }
                  - { label: American Express, value: americanexpress }
              - label: Produktleiste
                name: products
                widget: list
                i18n: true
                summary: "{{fields.label}} – {{fields.price}}"
                fields:
                  - { label: Name, name: label, widget: string, i18n: true }
                  - { label: Beschreibung, name: text, widget: string, i18n: true }
                  - { label: "Preis aus der Schnittstelle", name: priceKey, widget: select, required: false, options: [{ label: "eSIM (günstigster Preis)", value: esim }, { label: Lounge, value: lounge }, { label: Fast Track, value: fasttrack }, { label: Vignette, value: vignette }], hint: "Preise werden nie von Hand eingetragen – sie kommen live von den Anbietern." }
                  - { label: Text statt Preis (nur bei „Demnächst“), name: soonText, widget: string, required: false, i18n: true }
                  - { label: Link, name: url, widget: string, required: false }
                  - { label: Demnächst (ausgegraut), name: comingSoon, widget: boolean, default: false }

          - label: "Bereich: Beliebte Reiseziele"
            name: destinations
            widget: object
            i18n: true
            collapsed: true
            hint: "Welche Länder hier erscheinen, stellst du unter „eSIM-Länder & Pakete“ ein (Schalter „Beliebt“)."
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Zusätzliches Suchfeld anzeigen, name: showSearch, widget: boolean, default: false, required: false }
              - { label: Platzhalter im Suchfeld, name: searchPlaceholder, widget: string, i18n: true }
              - { label: Hinweis unter den Karten, name: hint, widget: string, i18n: true }

          - label: "Bereich: Regionale & globale Pakete"
            name: packages
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Hinweistext, name: note, widget: string, i18n: true }
              - { label: "Global: Name in der Auswahl", name: globalName, widget: string, i18n: true }
              - { label: "Global: Zusatz in der Auswahl", name: globalNote, widget: string, i18n: true }
              - { label: "Global: Überzeile", name: globalKicker, widget: string, i18n: true }
              - { label: "Global: Überschrift", name: globalTitle, widget: string, i18n: true }
              - { label: "Global: Text", name: globalText, widget: text, i18n: true }
              - { label: "Global: Hintergrundbild", name: globalImage, widget: image, choose_url: true }

          - label: "Bereich: Was ist eine eSIM?"
            name: howto
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Text, name: text, widget: text, i18n: true }
              - { label: Bild, name: image, widget: image, choose_url: true }
              - { label: Bildunterschrift, name: imageCaption, widget: string, required: false, i18n: true }
              - label: Schritte
                name: steps
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string, i18n: true }
                  - { label: Text, name: text, widget: text, i18n: true }
              - { label: Button-Text, name: button, widget: string, i18n: true }
              - { label: Link-Text zur Installationsanleitung, name: guideLink, widget: string, required: false, i18n: true }

          - label: "Bereich: Lounge & Fast Track"
            name: airport
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Hinweistext, name: note, widget: string, i18n: true }
              - label: Karten
                name: cards
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string, i18n: true }
                  - { label: Text, name: text, widget: text, i18n: true }
                  - { label: Bild, name: image, widget: image, choose_url: true }
                  - { label: Vorteile, name: ticks, widget: list, field: { label: Vorteil, name: tick, widget: string }, i18n: true }
                  - { label: "Preis aus der Schnittstelle", name: priceKey, widget: select, options: [{ label: "eSIM (günstigster Preis)", value: esim }, { label: Lounge, value: lounge }, { label: Fast Track, value: fasttrack }, { label: Vignette, value: vignette }] }
                  - { label: Button-Text, name: button, widget: string, i18n: true }
              - { label: Flughäfen in der Suche, name: airports, widget: list, field: { label: Flughafen, name: airport, widget: string }, i18n: true }
              - { label: Such-Button, name: searchButton, widget: string, i18n: true }

          - label: "Bereich: Bewertungen"
            name: reviews
            widget: object
            i18n: true
            collapsed: true
            hint: "Die einzelnen Bewertungen pflegst du unter „Bewertungen“. Später durch das Trustpilot-Widget ersetzen."
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: "Durchschnitt (z. B. 4,8)", name: score, widget: string, i18n: true }
              - { label: Bewertungswort, name: label, widget: string, i18n: true }
              - { label: Anzahl Bewertungen, name: count, widget: string, i18n: true }
              - { label: Link-Text, name: linkText, widget: string, i18n: true }
              - { label: Link zu Trustpilot, name: linkUrl, widget: string }

          - label: "Bereich: Digitaler Assistent & FAQ"
            name: assistant
            widget: object
            i18n: true
            collapsed: true
            hint: "Fragen, Antworten und Banner pflegst du unter „Assistent & FAQ“."
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Hinweistext, name: note, widget: text, i18n: true }
              - { label: FAQ-Überschrift, name: faqTitle, widget: string, i18n: true }
              - { label: FAQ-Text, name: faqText, widget: string, i18n: true }

          - label: "Bereich: Magazin / Blog"
            name: blog
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Überzeile, name: kicker, widget: string, i18n: true }
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Link-Text, name: linkText, widget: string, i18n: true }
              - { label: Link, name: linkUrl, widget: string }

          - label: "Bereich: Newsletter"
            name: newsletter
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Überschrift, name: title, widget: string, i18n: true }
              - { label: Text, name: text, widget: string, i18n: true }
              - { label: Platzhalter, name: placeholder, widget: string, i18n: true }
              - { label: Button-Text, name: button, widget: string, i18n: true }
              - { label: Erfolgsmeldung, name: success, widget: text, i18n: true }

          - label: Footer
            name: footer
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: Kurztext unter dem Logo, name: tagline, widget: string, i18n: true }
              - label: Spalten
                name: columns
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: Überschrift, name: title, widget: string, i18n: true }
                  - label: Links
                    name: links
                    widget: list
                    i18n: true
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Text, name: label, widget: string, i18n: true }
                      - { label: Link, name: url, widget: string }
              - { label: Zahlungslogos, name: payments, widget: select, multiple: true, options: *payments }
              - label: Rechtliche Links
                name: legal
                widget: list
                i18n: true
                summary: "{{fields.label}}"
                fields:
                  - { label: Text, name: label, widget: string, i18n: true }
                  - { label: Link, name: url, widget: string }
              - { label: Copyright, name: copyright, widget: string, i18n: true }

  # ------------------------------------------------------------------------
  - name: produkte
    i18n: true
    label: Produkte
    editor: { preview: false }
    files:
      - name: esim
        label: eSIM-Länder & Pakete
        file: content/esim.json
        i18n: true
        fields:
          - label: Länder
            name: countries
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.name}} – ab {{fields.from}} €"
            hint: "„Beliebt“ = erscheint im Slider „Beliebte Reiseziele“."
            fields:
              - { label: "Ländercode (ISO, z. B. tr)", name: code, widget: string, hint: "Zwei Buchstaben, klein – bestimmt die Flagge." }
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Beliebt, name: popular, widget: boolean, default: false }
              - { label: "Kennzeichen (z. B. Bestseller, 5G)", name: tag, widget: string, required: false, i18n: true }
              - { label: Bild, name: image, widget: image, choose_url: true, required: false }
          - label: Regionale Pakete
            name: regional
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: Kürzel, name: id, widget: string }
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Anzahl Länder, name: countries, widget: number }
              - { label: Datenvolumen, name: data, widget: string, i18n: true }
              - { label: Beschreibung, name: note, widget: string, i18n: true }
              - { label: Bild, name: image, widget: image, choose_url: true, required: false }
              - { label: Länder auf der Weltkarte, name: mapCodes, widget: list, required: false, hint: "ISO-Ländernummern (z. B. 276 = Deutschland, 792 = Türkei). Diese Länder werden auf der Karte grün markiert und eingekreist." }
          # Globale Pakete und alle Paketgrößen/Preise kommen ausschließlich aus der Preis-Schnittstelle.

  # ------------------------------------------------------------------------
  - name: hilfe
    i18n: true
    label: Hilfe-Center
    editor: { preview: false }
    files:
      - name: assistant
        label: Assistent & FAQ
        file: content/assistant.json
        i18n: true
        fields:
          - label: Digitale Assistentin
            name: persona
            widget: object
            i18n: true
            hint: "Gesicht und Name des Assistenten. Bitte klar als „digital“ kennzeichnen, damit Kunden wissen, dass sie mit einer KI schreiben."
            fields:
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Rolle, name: role, widget: string, i18n: true }
              - { label: Kennzeichnung, name: badge, widget: string, i18n: true }
              - { label: Foto, name: image, widget: image, choose_url: true }
              - { label: Vorstellungstext, name: intro, widget: text, i18n: true }
          - { label: Begrüßung, name: greeting, widget: text, i18n: true }
          - { label: "Antwort, wenn nichts gefunden wird", name: fallback, widget: text, i18n: true }
          - { label: Kontakt-Text (Übergabe ans Team), name: contactText, widget: text, i18n: true }
          - { label: Kontakt-E-Mail, name: contactEmail, widget: string }
          - label: Die drei großen Banner
            name: banners
            widget: list
            i18n: true
            max: 3
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string, i18n: true }
              - { label: Text, name: text, widget: string, i18n: true }
              - label: Symbol
                name: icon
                widget: select
                options: [{ label: Handy, value: phone }, { label: QR-Code, value: qr }, { label: SIM-Karte, value: sim }, { label: Sprechblase, value: chat }]
              - { label: "Aktion", name: action, widget: string, hint: "„device-check“ öffnet den Geräte-Check. Sonst die ID einer FAQ (z. B. install-esim) – der Assistent beantwortet dann diese Frage." }
          - { label: Schnellfragen unter dem Chat, name: suggestions, widget: list, field: { label: Frage, name: q, widget: string }, i18n: true }
          - label: Fragen & Antworten
            name: faqs
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.question}}"
            hint: "Jede Frage erscheint in der FAQ und wird vom Assistenten genutzt."
            fields:
              - { label: ID, name: id, widget: string, hint: "Eindeutig, nur Kleinbuchstaben und Bindestriche, z. B. lounge-kinder" }
              - label: Kategorie
                name: category
                widget: select
                options: [{ label: eSIM, value: esim }, { label: Lounge, value: lounge }, { label: Fast Track, value: fasttrack }, { label: Zahlung & Erstattung, value: zahlung }, { label: Allgemein, value: allgemein }]
              - { label: Frage, name: question, widget: string, i18n: true }
              - { label: Antwort, name: answer, widget: text, hint: "**fett**, neue Zeile mit „- “ = Aufzählung, Leerzeile = neuer Absatz, [Linktext](https://…)", i18n: true }
              - { label: Suchbegriffe, name: keywords, widget: list, hint: "Wörter, mit denen Kunden danach fragen könnten (auch Umgangssprache, Tippfehler).", i18n: true }
              - { label: Wie oft gefragt, name: views, widget: number, hint: "Höhere Zahl = weiter oben in der FAQ. Die 3 höchsten bekommen „Häufig gefragt“." }
          - { label: eSIM-fähige Geräte, name: devices, widget: list, collapsed: true, field: { label: Gerät, name: device, widget: string } }

      - name: install
        label: Installationsanleitung (Unterseite)
        file: content/install.json
        i18n: true
        fields:
          - { label: Überzeile, name: kicker, widget: string, i18n: true }
          - { label: Überschrift, name: title, widget: string, i18n: true }
          - { label: Einleitung, name: intro, widget: text, i18n: true }
          - { label: "Checkliste: Überschrift", name: beforeTitle, widget: string, i18n: true }
          - { label: "Checkliste: Punkte", name: before, widget: list, field: { label: Punkt, name: item, widget: string }, i18n: true }
          - label: Geräte / Betriebssysteme
            name: platforms
            widget: list
            i18n: true
            summary: "{{fields.label}}"
            fields:
              - { label: Kürzel, name: id, widget: string, hint: "z. B. ios, samsung, pixel" }
              - { label: Name im Tab, name: label, widget: string, i18n: true }
              - { label: Zusatz (Version), name: sub, widget: string, required: false, i18n: true }
              - label: Schritte
                name: steps
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string, i18n: true }
                  - { label: Text, name: text, widget: text, hint: "**fett** für Menüpunkte", i18n: true }
                  - { label: Tipp (gelber Kasten), name: tip, widget: text, required: false, i18n: true }
                  - label: Handy-Bildschirm
                    name: screen
                    widget: object
                    i18n: true
                    fields:
                      - label: Art
                        name: type
                        widget: select
                        options: [{ label: "Menü / Liste", value: list }, { label: "Auswahl (Radio)", value: choice }, { label: "QR-Code scannen", value: qr }, { label: "Fertig / Verbunden", value: done }]
                      - label: Stil
                        name: style
                        widget: select
                        required: false
                        options: [{ label: iPhone, value: ios }, { label: Android, value: android }]
                      - { label: Titel oben, name: title, widget: string, required: false, i18n: true }
                      - { label: Untertitel (bei QR / Fertig), name: caption, widget: string, required: false, i18n: true }
                      - label: Zeilen
                        name: items
                        widget: list
                        i18n: true
                        required: false
                        summary: "{{fields.label}}"
                        fields:
                          - { label: Text, name: label, widget: string, i18n: true }
                          - { label: Wert rechts / darunter, name: value, widget: string, required: false, i18n: true }
                          - { label: Symbolfarbe, name: color, widget: color, required: false }
                          - label: Schalter
                            name: toggle
                            widget: select
                            required: false
                            options: [{ label: An, value: "on" }, { label: Aus, value: "off" }]
                          - { label: "Hier tippen (grün markiert)", name: tap, widget: boolean, required: false }
                          - { label: Als Link (blau), name: accent, widget: boolean, required: false }
                          - { label: Ausgewählt (bei Auswahl), name: selected, widget: boolean, required: false }
          - { label: "Hilfe bei Problemen: Überschrift", name: troubleTitle, widget: string, i18n: true }
          - label: "Hilfe bei Problemen"
            name: trouble
            widget: list
            i18n: true
            summary: "{{fields.q}}"
            fields:
              - { label: Problem, name: q, widget: string, i18n: true }
              - { label: Lösung, name: a, widget: text, i18n: true }
          - { label: "Kontakt: Überschrift", name: helpTitle, widget: string, i18n: true }
          - { label: "Kontakt: Text", name: helpText, widget: text, i18n: true }
          - { label: "Kontakt: Button", name: helpButton, widget: string, i18n: true }

  # ------------------------------------------------------------------------
  # Blog: jeder Artikel ist eine Datei in content/posts/ (Dateiname = Adresse, z. B. blog.html?p=japonya-esim).
  # Die Übersicht content/blog.json wird beim Veröffentlichen automatisch daraus erzeugt.
  - name: posts
    label: Blog-Artikel
    label_singular: Artikel
    folder: content/posts
    extension: json
    format: json
    create: true
    i18n: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    editor: { preview: false }
    fields:
      - { label: Titel (auch Seitentitel für Google), name: title, widget: string, i18n: true }
      - { label: Kurztext (auch Beschreibung für Google), name: excerpt, widget: text, i18n: true }
      - { label: Kategorie, name: category, widget: string, i18n: true }
      - { label: Lesezeit, name: readTime, widget: string, i18n: true, hint: "z. B. 5 dk / 5 Min." }
      - { label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: Bild, name: image, widget: image, choose_url: true, required: false, hint: "Leer lassen = Bild des Reiseziels" }
      - { label: "Reiseziel (Ländercode, z. B. jp)", name: country, widget: string, required: false, hint: "Zeigt am Ende die eSIM-Pakete dieses Landes" }
      - { label: Abschluss-Box, name: cta, widget: select, options: [esim, airport], default: esim, required: false }
      - { label: Text, name: body, widget: markdown, i18n: true, hint: "Zwischenüberschriften mit ##. Preise nur als Platzhalter, z. B. {fiyat:country:jp} oder {fiyat:lounge}." }
      - { label: Entwurf (nicht veröffentlichen), name: draft, widget: boolean, default: false, required: false }

