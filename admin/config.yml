# ==========================================================================
# passport.io – Felder für den Mağaza editörü im Panel (admin/panel-editor.js)
# Gespeichert wird über die Supabase-Funktion admin (nur ADMIN_EMAILS) → GitHub → automatische Veröffentlichung.
# Der Block „backend“ stammt vom früheren Decap CMS und wird nicht mehr genutzt.
# ==========================================================================

backend:
  name: github
  repo: yildirimavam55-glitch/passport-io
  branch: main
  base_url: https://sbzwibctxezprpefwxzn.supabase.co
  commit_messages:
    create: "Inhalt: {{collection}} „{{slug}}“ angelegt"
    update: "Inhalt: {{collection}} „{{slug}}“ geändert"
    delete: "Inhalt: {{collection}} „{{slug}}“ gelöscht"

local_backend: true
locale: tr

# Mehrsprachigkeit: alle Sprachen liegen in derselben Datei ({ "tr": …, "en": …, "de": … }).
# Türkisch ist die Hauptsprache und enthält Bilder, Links, Preise-Schlüssel usw.; andere Sprachen nur die Texte.
i18n:
  structure: single_file
  locales: [tr, en, de, ar, ru, fr, es, it, pt, nl, pl, ja, ko]
  default_locale: tr
site_url: /
display_url: /

media_folder: img/uploads
public_folder: img/uploads

collections:
  # ------------------------------------------------------------------------
  - name: seiten
    i18n: true
    label: "Ana sayfa"
    editor: { preview: false }
    files:
      - name: site
        label: "Ana sayfa & tasarım"
        file: content/site.json
        i18n: true
        fields:
          - label: "Marka renkleri"
            name: theme
            widget: object
            collapsed: true
            fields:
              - { label: "Vurgu rengi (yeşil)", name: green, widget: color }
              - { label: "Koyu renk", name: dark, widget: color }

          - label: "Fiyat arayüzü (API)"
            name: api
            widget: object
            i18n: true
            collapsed: true
            hint: "Alle Preise der Seite kommen von hier. Lokal: api/prices.json (Testdaten). Live: Adresse des Preis-Proxys, z. B. /.netlify/functions/prices"
            fields:
              - { label: "Adres", name: pricesUrl, widget: string }
              - { label: "Lina'nın yanıtlayamadığı sorular için adres (Supabase)", name: questionsUrl, widget: string, required: false }
              - { label: "Lina yapay zekâ adresi (Supabase, isteğe bağlı)", name: linaUrl, widget: string, required: false }
              - { label: "Fiyat yoksa gösterilecek metin", name: unavailableText, widget: string, i18n: true }
              - { label: "Fiyat yoksa paket penceresindeki not", name: modalUnavailableText, widget: text, i18n: true }

          - label: "Önizleme notu"
            name: preview
            widget: object
            i18n: true
            collapsed: true
            hint: "Gelber Hinweis oben auf der Seite. Vor dem Livegang ausschalten (wenn echte Preise und Trustpilot angebunden sind)."
            fields:
              - { label: "Göster", name: enabled, widget: boolean }
              - { label: "Metin", name: text, widget: string, i18n: true }

          - label: "Marka"
            name: brand
            widget: object
            collapsed: true
            fields:
              - { label: "Ad", name: name, widget: string, i18n: true }
              - { label: "Uzantı", name: suffix, widget: string, i18n: true }

          - label: "Duyuru çubuğu (en üstte)"
            name: announcement
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Göster", name: enabled, widget: boolean, default: false }
              - { label: "Metin", name: text, widget: string, i18n: true }
              - { label: "Bağlantı", name: link, widget: string, required: false }

          - label: "Ana sayfa düzeni"
            name: sections
            widget: list
            hint: "Reihenfolge per Ziehen ändern. Bereiche mit dem Schalter ein- oder ausblenden."
            summary: "{{fields.type}} {{fields.enabled}}"
            fields:
              - label: "Bölüm"
                name: type
                widget: select
                options:
                  - { label: "Giriş görseli (hero)", value: hero }
                  - { label: "Ağ operatörleri (kayan şerit)", value: networks }
                  - { label: "Öne çıkan ülke paketleri", value: featured }
                  - { label: "Güvenceler (iade, abonelik yok…)", value: promises }
                  - { label: "Popüler destinasyonlar", value: destinations }
                  - { label: "Bölgesel & global paketler", value: packages }
                  - { label: "eSIM nedir?", value: howto }
                  - { label: "Lounge & Fast Track", value: airport }
                  - { label: "Değerlendirmeler", value: reviews }
                  - { label: "Dijital asistan & SSS", value: assistant }
                  - { label: "Dergi / blog", value: blog }
                  - { label: "Bülten", value: newsletter }
              - { label: "Görünür", name: enabled, widget: boolean, default: true }

          - label: "Menü"
            name: nav
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: "Metin", name: label, widget: string, i18n: true }
              - { label: "Bağlantı", name: url, widget: string }
              - { label: "Etiket (ör. „yakında“)", name: badge, widget: string, required: false, i18n: true }

          - label: "Bölüm: Giriş görseli (hero)"
            name: hero
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, hint: "Preise nur als Platzhalter: {preis:esim}, {preis:lounge}, {preis:fasttrack}, {preis:country:tr}", i18n: true }
              - { label: "Alt satır", name: subtitle, widget: string, hint: "Preise nur als Platzhalter, z. B. „Ab {preis:esim}, in zwei Minuten aktiv.“", i18n: true }
              - { label: "Arka plan görseli", name: image, widget: image, choose_url: true }
              - { label: "Arama kutusu ipucu", name: searchPlaceholder, widget: string, i18n: true }
              - { label: "Arama düğmesi", name: searchButton, widget: string, i18n: true }
              - label: "Güven maddeleri"
                name: facts
                widget: list
                i18n: true
                summary: "{{fields.text}}"
                fields:
                  - label: "Simge"
                    name: icon
                    widget: select
                    options:
                      - { label: "Trustpilot yıldızı", value: trustpilot }
                      - { label: "E-posta", value: mail }
                      - { label: "Kalkan", value: shield }
                      - { label: "Onay işareti", value: check }
                  - { label: "Metin", name: text, widget: string, i18n: true }
              - { label: "Ödeme logolarından önceki metin", name: paymentsLabel, widget: string, required: false, i18n: true }
              - label: "Giriş görselindeki ödeme logoları"
                name: payments
                widget: select
                multiple: true
                required: false
                options: &payments
                  - { label: Apple Pay, value: applepay }
                  - { label: Google Pay, value: googlepay }
                  - { label: Klarna, value: klarna }
                  - { label: PayPal, value: paypal }
                  - { label: Visa, value: visa }
                  - { label: Mastercard, value: mastercard }
                  - { label: American Express, value: americanexpress }
              - label: "Ürün çubuğu"
                name: products
                widget: list
                i18n: true
                summary: "{{fields.label}} – {{fields.price}}"
                fields:
                  - { label: "Ad", name: label, widget: string, i18n: true }
                  - { label: "Açıklama", name: text, widget: string, i18n: true }
                  - { label: "API'den gelen fiyat", name: priceKey, widget: select, required: false, options: [{ label: "eSIM (en düşük fiyat)", value: esim }, { label: Lounge, value: lounge }, { label: Fast Track, value: fasttrack }, { label: "Vinyet", value: vignette }], hint: "Preise werden nie von Hand eingetragen – sie kommen live von den Anbietern." }
                  - { label: "Fiyat yerine metin (yalnızca „yakında“ ise)", name: soonText, widget: string, required: false, i18n: true }
                  - { label: "Bağlantı", name: url, widget: string, required: false }
                  - { label: "Yakında (soluk)", name: comingSoon, widget: boolean, default: false }

          - label: "Bölüm: Popüler destinasyonlar"
            name: destinations
            widget: object
            i18n: true
            collapsed: true
            hint: "Welche Länder hier erscheinen, stellst du unter „eSIM-Länder & Pakete“ ein (Schalter „Beliebt“)."
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Ek arama kutusu göster", name: showSearch, widget: boolean, default: false, required: false }
              - { label: "Arama kutusu ipucu", name: searchPlaceholder, widget: string, i18n: true }
              - { label: "Kartların altındaki not", name: hint, widget: string, i18n: true }

          - label: "Bölüm: Bölgesel & global paketler"
            name: packages
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Not metni", name: note, widget: string, i18n: true }
              - { label: "Global: seçimdeki ad", name: globalName, widget: string, i18n: true }
              - { label: "Global: seçimdeki ek", name: globalNote, widget: string, i18n: true }
              - { label: "Global: üst başlık", name: globalKicker, widget: string, i18n: true }
              - { label: "Global: başlık", name: globalTitle, widget: string, i18n: true }
              - { label: "Global: metin", name: globalText, widget: text, i18n: true }
              - { label: "Global: arka plan görseli", name: globalImage, widget: image, choose_url: true }

          - label: "Bölüm: eSIM nedir?"
            name: howto
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Metin", name: text, widget: text, i18n: true }
              - { label: "Görsel", name: image, widget: image, choose_url: true }
              - { label: "Görsel alt yazısı", name: imageCaption, widget: string, required: false, i18n: true }
              - label: "Adımlar"
                name: steps
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "Başlık", name: title, widget: string, i18n: true }
                  - { label: "Metin", name: text, widget: text, i18n: true }
              - { label: "Düğme metni", name: button, widget: string, i18n: true }
              - { label: "Kurulum rehberi bağlantı metni", name: guideLink, widget: string, required: false, i18n: true }

          - label: "Bölüm: Lounge & Fast Track"
            name: airport
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Not metni", name: note, widget: string, i18n: true }
              - label: "Kartlar"
                name: cards
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "Başlık", name: title, widget: string, i18n: true }
                  - { label: "Metin", name: text, widget: text, i18n: true }
                  - { label: "Görsel", name: image, widget: image, choose_url: true }
                  - { label: "Avantajlar", name: ticks, widget: list, field: { label: "Avantaj", name: tick, widget: string }, i18n: true }
                  - { label: "API'den gelen fiyat", name: priceKey, widget: select, options: [{ label: "eSIM (en düşük fiyat)", value: esim }, { label: Lounge, value: lounge }, { label: Fast Track, value: fasttrack }, { label: "Vinyet", value: vignette }] }
                  - { label: "Düğme metni", name: button, widget: string, i18n: true }
              - { label: "Aramadaki havalimanları", name: airports, widget: list, field: { label: "Havalimanı", name: airport, widget: string }, i18n: true }
              - { label: "Arama düğmesi", name: searchButton, widget: string, i18n: true }

          - label: "Bölüm: Değerlendirmeler"
            name: reviews
            widget: object
            i18n: true
            collapsed: true
            hint: "Die einzelnen Bewertungen pflegst du unter „Bewertungen“. Später durch das Trustpilot-Widget ersetzen."
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Ortalama (ör. 4,8)", name: score, widget: string, i18n: true }
              - { label: "Değerlendirme kelimesi", name: label, widget: string, i18n: true }
              - { label: "Değerlendirme sayısı", name: count, widget: string, i18n: true }
              - { label: "Bağlantı metni", name: linkText, widget: string, i18n: true }
              - { label: "Trustpilot bağlantısı", name: linkUrl, widget: string }

          - label: "Bölüm: Dijital asistan & SSS"
            name: assistant
            widget: object
            i18n: true
            collapsed: true
            hint: "Fragen, Antworten und Banner pflegst du unter „Assistent & FAQ“."
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Not metni", name: note, widget: text, i18n: true }
              - { label: "SSS başlığı", name: faqTitle, widget: string, i18n: true }
              - { label: "SSS metni", name: faqText, widget: string, i18n: true }

          - label: "Bölüm: Dergi / blog"
            name: blog
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Bağlantı metni", name: linkText, widget: string, i18n: true }
              - { label: "Bağlantı", name: linkUrl, widget: string }

          - label: "Bölüm: Bülten"
            name: newsletter
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Metin", name: text, widget: string, i18n: true }
              - { label: "İpucu metni", name: placeholder, widget: string, i18n: true }
              - { label: "Düğme metni", name: button, widget: string, i18n: true }
              - { label: "Başarı mesajı", name: success, widget: text, i18n: true }

          - label: "Alt bilgi"
            name: footer
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { label: "Logo altındaki kısa metin", name: tagline, widget: string, i18n: true }
              - label: "Sütunlar"
                name: columns
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "Başlık", name: title, widget: string, i18n: true }
                  - label: "Bağlantılar"
                    name: links
                    widget: list
                    i18n: true
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Metin", name: label, widget: string, i18n: true }
                      - { label: "Bağlantı", name: url, widget: string }
              - { label: "Ödeme logoları", name: payments, widget: select, multiple: true, options: *payments }
              - label: "Yasal bağlantılar"
                name: legal
                widget: list
                i18n: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Metin", name: label, widget: string, i18n: true }
                  - { label: "Bağlantı", name: url, widget: string }
              - { label: "Telif hakkı", name: copyright, widget: string, i18n: true }

  # ------------------------------------------------------------------------
  - name: produkte
    i18n: true
    label: "Ürünler"
    editor: { preview: false }
    files:
      - name: esim
        label: "eSIM ülkeleri & paketler"
        file: content/esim.json
        i18n: true
        fields:
          - label: "Ülkeler"
            name: countries
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.name}} – ab {{fields.from}} €"
            hint: "„Beliebt“ = erscheint im Slider „Beliebte Reiseziele“."
            fields:
              - { label: "Ülke kodu (ISO, ör. tr)", name: code, widget: string, hint: "Zwei Buchstaben, klein – bestimmt die Flagge." }
              - { label: "Ad", name: name, widget: string, i18n: true }
              - { label: "Popüler", name: popular, widget: boolean, default: false }
              - { label: "Etiket (ör. Çok satan, 5G)", name: tag, widget: string, required: false, i18n: true }
              - { label: "Görsel", name: image, widget: image, choose_url: true, required: false }
          - label: "Bölgesel paketler"
            name: regional
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "Kısaltma", name: id, widget: string }
              - { label: "Ad", name: name, widget: string, i18n: true }
              - { label: "Ülke sayısı", name: countries, widget: number }
              - { label: "Veri miktarı", name: data, widget: string, i18n: true }
              - { label: "Açıklama", name: note, widget: string, i18n: true }
              - { label: "Görsel", name: image, widget: image, choose_url: true, required: false }
              - { label: "Dünya haritasındaki ülkeler", name: mapCodes, widget: list, required: false, hint: "ISO-Ländernummern (z. B. 276 = Deutschland, 792 = Türkei). Diese Länder werden auf der Karte grün markiert und eingekreist." }
          # Globale Pakete und alle Paketgrößen/Preise kommen ausschließlich aus der Preis-Schnittstelle.

  # ------------------------------------------------------------------------
  - name: hilfe
    i18n: true
    label: "Yardım merkezi"
    editor: { preview: false }
    files:
      - name: assistant
        label: "Asistan & SSS"
        file: content/assistant.json
        i18n: true
        fields:
          - label: "Dijital asistan"
            name: persona
            widget: object
            i18n: true
            hint: "Gesicht und Name des Assistenten. Bitte klar als „digital“ kennzeichnen, damit Kunden wissen, dass sie mit einer KI schreiben."
            fields:
              - { label: "Ad", name: name, widget: string, i18n: true }
              - { label: "Rol", name: role, widget: string, i18n: true }
              - { label: "Etiket", name: badge, widget: string, i18n: true }
              - { label: "Fotoğraf", name: image, widget: image, choose_url: true }
              - { label: "Tanıtım metni", name: intro, widget: text, i18n: true }
          - { label: "Karşılama", name: greeting, widget: text, i18n: true }
          - { label: "Bir şey bulunamazsa yanıt", name: fallback, widget: text, i18n: true }
          - { label: "İletişim metni (ekibe aktarım)", name: contactText, widget: text, i18n: true }
          - { label: "İletişim e-postası", name: contactEmail, widget: string }
          - label: "Yardım konuları (soru şeridinin başında)"
            name: banners
            widget: list
            i18n: true
            max: 3
            summary: "{{fields.title}}"
            fields:
              - { label: "Başlık", name: title, widget: string, i18n: true }
              - { label: "Metin", name: text, widget: string, i18n: true }
              - label: "Simge"
                name: icon
                widget: select
                options: [{ label: "Telefon", value: phone }, { label: "QR kod", value: qr }, { label: "SIM kart", value: sim }, { label: "Konuşma balonu", value: chat }]
              - { label: "Eylem", name: action, widget: string, hint: "„device-check“ öffnet den Geräte-Check. Sonst die ID einer FAQ (z. B. install-esim) – der Assistent beantwortet dann diese Frage." }
          - { label: "Hızlı sorular", name: suggestions, widget: list, field: { label: "Soru", name: q, widget: string }, i18n: true }
          - label: "Sorular & yanıtlar"
            name: faqs
            widget: list
            i18n: true
            collapsed: true
            summary: "{{fields.question}}"
            hint: "Jede Frage erscheint in der FAQ und wird vom Assistenten genutzt."
            fields:
              - { label: "Kimlik", name: id, widget: string, hint: "Eindeutig, nur Kleinbuchstaben und Bindestriche, z. B. lounge-kinder" }
              - label: "Kategori"
                name: category
                widget: select
                options: [{ label: eSIM, value: esim }, { label: Lounge, value: lounge }, { label: Fast Track, value: fasttrack }, { label: "Sorun giderme", value: probleme }, { label: "Ödeme & iade", value: zahlung }, { label: "Genel", value: allgemein }]
              - { label: "Soru", name: question, widget: string, i18n: true }
              - { label: "Yanıt", name: answer, widget: text, hint: "**fett**, neue Zeile mit „- “ = Aufzählung, Leerzeile = neuer Absatz, [Linktext](https://…)", i18n: true }
              - { label: "Arama kelimeleri", name: keywords, widget: list, hint: "Wörter, mit denen Kunden danach fragen könnten (auch Umgangssprache, Tippfehler).", i18n: true }
              - { label: "Sonraki adımlar", name: next, widget: list, required: false, hint: "Kimlik (id) anderer Fragen, die als Knöpfe unter der Antwort erscheinen – z. B. data-roaming, network-select." }
              - { label: "Kaç kez soruldu", name: views, widget: number, hint: "Höhere Zahl = weiter oben in der FAQ. Die 3 höchsten bekommen „Häufig gefragt“." }
          - { label: "eSIM uyumlu cihazlar", name: devices, widget: list, collapsed: true, field: { label: "Cihaz", name: device, widget: string } }
          - { label: "eSIM desteklemeyen cihazlar", name: devicesNo, widget: list, collapsed: true, required: false, field: { label: "Cihaz", name: device, widget: string } }

      - name: install
        label: "Kurulum rehberi (alt sayfa)"
        file: content/install.json
        i18n: true
        fields:
          - { label: "Üst başlık", name: kicker, widget: string, i18n: true }
          - { label: "Başlık", name: title, widget: string, i18n: true }
          - { label: "Giriş metni", name: intro, widget: text, i18n: true }
          - { label: "Kontrol listesi: başlık", name: beforeTitle, widget: string, i18n: true }
          - { label: "Kontrol listesi: maddeler", name: before, widget: list, field: { label: "Madde", name: item, widget: string }, i18n: true }
          - label: "Cihazlar / işletim sistemleri"
            name: platforms
            widget: list
            i18n: true
            summary: "{{fields.label}}"
            fields:
              - { label: "Kısaltma", name: id, widget: string, hint: "z. B. ios, samsung, pixel" }
              - { label: "Sekmedeki ad", name: label, widget: string, i18n: true }
              - { label: "Ek (sürüm)", name: sub, widget: string, required: false, i18n: true }
              - label: "Adımlar"
                name: steps
                widget: list
                i18n: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "Başlık", name: title, widget: string, i18n: true }
                  - { label: "Metin", name: text, widget: text, hint: "**fett** für Menüpunkte", i18n: true }
                  - { label: "İpucu (sarı kutu)", name: tip, widget: text, required: false, i18n: true }
                  - label: "Telefon ekranı"
                    name: screen
                    widget: object
                    i18n: true
                    fields:
                      - label: "Tür"
                        name: type
                        widget: select
                        options: [{ label: "Menü / liste", value: list }, { label: "Seçim (radyo)", value: choice }, { label: "QR kod tarama", value: qr }, { label: "Tamam / bağlandı", value: done }]
                      - label: "Stil"
                        name: style
                        widget: select
                        required: false
                        options: [{ label: iPhone, value: ios }, { label: Android, value: android }]
                      - { label: "Üst başlık", name: title, widget: string, required: false, i18n: true }
                      - { label: "Alt başlık (QR / tamam)", name: caption, widget: string, required: false, i18n: true }
                      - label: "Satırlar"
                        name: items
                        widget: list
                        i18n: true
                        required: false
                        summary: "{{fields.label}}"
                        fields:
                          - { label: "Metin", name: label, widget: string, i18n: true }
                          - { label: "Sağdaki / alttaki değer", name: value, widget: string, required: false, i18n: true }
                          - { label: "Simge rengi", name: color, widget: color, required: false }
                          - label: "Anahtar"
                            name: toggle
                            widget: select
                            required: false
                            options: [{ label: "Açık", value: "on" }, { label: "Kapalı", value: "off" }]
                          - { label: "Buraya dokun (yeşil işaretli)", name: tap, widget: boolean, required: false }
                          - { label: "Bağlantı olarak (mavi)", name: accent, widget: boolean, required: false }
                          - { label: "Seçili (seçimde)", name: selected, widget: boolean, required: false }
          - { label: "Sorun giderme: başlık", name: troubleTitle, widget: string, i18n: true }
          - label: "Sorun giderme"
            name: trouble
            widget: list
            i18n: true
            summary: "{{fields.q}}"
            fields:
              - { label: "Sorun", name: q, widget: string, i18n: true }
              - { label: "Çözüm", name: a, widget: text, i18n: true }
          - { label: "İletişim: başlık", name: helpTitle, widget: string, i18n: true }
          - { label: "İletişim: metin", name: helpText, widget: text, i18n: true }
          - { label: "İletişim: düğme", name: helpButton, widget: string, i18n: true }

  # ------------------------------------------------------------------------
  # Blog: jeder Artikel ist eine Datei in content/posts/ (Dateiname = Adresse, z. B. blog.html?p=japonya-esim).
  # Die Übersicht content/blog.json wird beim Veröffentlichen automatisch daraus erzeugt.
  - name: posts
    label: "Blog yazıları"
    label_singular: "Yazı"
    folder: content/posts
    extension: json
    format: json
    create: true
    i18n: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    editor: { preview: false }
    fields:
      - { label: "Başlık (Google sayfa başlığı)", name: title, widget: string, i18n: true }
      - { label: "Kısa metin (Google açıklaması)", name: excerpt, widget: text, i18n: true }
      - { label: "Kategori", name: category, widget: string, i18n: true }
      - { label: "Okuma süresi", name: readTime, widget: string, i18n: true, hint: "z. B. 5 dk / 5 Min." }
      - { label: "Tarih", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Görsel", name: image, widget: image, choose_url: true, required: false, hint: "Leer lassen = Bild des Reiseziels" }
      - { label: "Destinasyon (ülke kodu, ör. jp)", name: country, widget: string, required: false, hint: "Zeigt am Ende die eSIM-Pakete dieses Landes" }
      - { label: "Kapanış kutusu", name: cta, widget: select, options: [esim, airport], default: esim, required: false }
      - { label: "Metin", name: body, widget: markdown, i18n: true, hint: "Zwischenüberschriften mit ##. Preise nur als Platzhalter, z. B. {fiyat:country:jp} oder {fiyat:lounge}." }
      - { label: "Taslak (yayınlama)", name: draft, widget: boolean, default: false, required: false }

