<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Lina, KI-Assistentin">
  <!-- Lina – KI-Assistentin von passport.io. Eigene, gezeichnete Figur: menschlich, aber erkennbar digital. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#16372a"/>
      <stop offset=".6" stop-color="#0c1712"/>
      <stop offset="1" stop-color="#060908"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c7a6"/>
      <stop offset=".55" stop-color="#e2a985"/>
      <stop offset="1" stop-color="#c98a68"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9785a" stop-opacity="0"/>
      <stop offset="1" stop-color="#9c5f45" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset=".5" stop-color="#1f1612"/>
      <stop offset="1" stop-color="#120c0a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ef58a" stop-opacity="0"/>
      <stop offset=".75" stop-color="#2ef58a" stop-opacity="0"/>
      <stop offset="1" stop-color="#2ef58a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2622"/>
      <stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#7ff7bd"/>
      <stop offset=".45" stop-color="#2a8f63"/>
      <stop offset="1" stop-color="#14382a"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e98a7a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e98a7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="c"><circle cx="120" cy="120" r="120"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="240" height="240" fill="url(#bg)"/>
    <!-- digitale Datenlinien im Hintergrund -->
    <g stroke="#2ef58a" stroke-opacity=".14" stroke-width="1" fill="none">
      <path d="M0 52h46l10 10h40"/><path d="M240 70h-40l-12 12h-30"/>
      <path d="M0 150h30l12-12h22"/><path d="M240 168h-34l-10 10h-20"/>
      <circle cx="96" cy="62" r="2.5" fill="#2ef58a" fill-opacity=".35"/>
      <circle cx="158" cy="82" r="2.5" fill="#2ef58a" fill-opacity=".35"/>
    </g>
    <circle cx="120" cy="108" r="86" fill="#2ef58a" opacity=".07" filter="url(#glow)"/>

    <!-- Haare hinten -->
    <path d="M58 132c-8-52 18-92 62-92s70 40 62 92c-2 26-8 52-16 74H74c-8-22-14-48-16-74z" fill="url(#hair)"/>

    <!-- Hals -->
    <path d="M102 158h36v30c-6 6-30 6-36 0z" fill="url(#skin)"/>
    <path d="M102 164c10 8 26 8 36 0v10c-10 6-26 6-36 0z" fill="#9c5f45" opacity=".35"/>

    <!-- Oberteil mit leuchtender Kante -->
    <path d="M40 240c4-34 30-54 80-56 50 2 76 22 80 56z" fill="url(#top)"/>
    <path d="M96 186c8 10 40 10 48 0" stroke="#2ef58a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M96 186c8 10 40 10 48 0" stroke="#2ef58a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".25" filter="url(#glow)"/>

    <!-- Gesicht -->
    <path d="M78 110c0-30 18-50 42-50s42 20 42 50c0 30-18 58-42 58s-42-28-42-58z" fill="url(#skin)"/>
    <path d="M78 110c0-30 18-50 42-50s42 20 42 50c0 30-18 58-42 58s-42-28-42-58z" fill="url(#skinShade)"/>
    <!-- Ohren -->
    <ellipse cx="78" cy="118" rx="7" ry="11" fill="#d9997a"/>
    <ellipse cx="162" cy="118" rx="7" ry="11" fill="#d9997a"/>

    <!-- Augenbrauen -->
    <path d="M90 100c7-5 16-6 24-3" stroke="#2a1d17" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M126 97c8-3 17-2 24 3" stroke="#2a1d17" stroke-width="3.4" fill="none" stroke-linecap="round"/>

    <!-- Augen -->
    <g>
      <path d="M90 114c6-7 18-7 24 0-6 6-18 6-24 0z" fill="#fbf7f2"/>
      <path d="M126 114c6-7 18-7 24 0-6 6-18 6-24 0z" fill="#fbf7f2"/>
      <circle cx="102" cy="114" r="5.4" fill="url(#iris)"/>
      <circle cx="138" cy="114" r="5.4" fill="url(#iris)"/>
      <circle cx="102" cy="114" r="2.3" fill="#08110d"/>
      <circle cx="138" cy="114" r="2.3" fill="#08110d"/>
      <circle cx="103.8" cy="112.2" r="1.4" fill="#fff"/>
      <circle cx="139.8" cy="112.2" r="1.4" fill="#fff"/>
      <path d="M89 113c7-8 19-8 26 0" stroke="#1d1410" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M125 113c7-8 19-8 26 0" stroke="#1d1410" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Nase -->
    <path d="M120 118c-2 10-4 16-7 20 3 2 9 2 12 0" stroke="#b27356" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wangen -->
    <circle cx="94" cy="134" r="11" fill="url(#cheek)"/>
    <circle cx="146" cy="134" r="11" fill="url(#cheek)"/>
    <!-- Mund -->
    <path d="M106 146c8 7 20 7 28 0" fill="#c4615a"/>
    <path d="M106 146c8 3 20 3 28 0" stroke="#8f3e39" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M112 150c5 2 11 2 16 0" stroke="#e58c84" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>

    <!-- Haare vorne mit Strähnen -->
    <path d="M74 112c-2-38 20-60 48-60 26 0 46 20 44 54-12-4-26-14-34-28-8 16-26 30-58 34z" fill="url(#hair)"/>
    <g stroke="#5a4033" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7">
      <path d="M92 70c-8 10-12 22-12 34"/><path d="M118 58c-6 12-14 24-26 32"/><path d="M134 66c6 10 16 18 28 22"/>
    </g>
    <path d="M74 112c-4 30 0 60 6 86" stroke="url(#hair)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M166 106c4 30 0 62-6 90" stroke="url(#hair)" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- digitales Konturlicht rechts (KI) -->
    <path d="M78 110c0-30 18-50 42-50s42 20 42 50c0 30-18 58-42 58s-42-28-42-58z" fill="url(#rim)"/>
    <path d="M150 74c12 10 18 24 18 40" stroke="#2ef58a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>

    <!-- Headset mit leuchtendem Mikrofon -->
    <path d="M74 112c0-36 20-60 46-60s46 24 46 60" stroke="#0d1411" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="66" y="106" width="14" height="24" rx="7" fill="#0d1411"/>
    <rect x="160" y="106" width="14" height="24" rx="7" fill="#0d1411"/>
    <rect x="163" y="112" width="8" height="12" rx="4" fill="#2ef58a" opacity=".85"/>
    <path d="M168 128c0 16-12 26-28 26" stroke="#0d1411" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="139" cy="154" r="5" fill="#0d1411"/>
    <circle cx="139" cy="154" r="2.4" fill="#2ef58a"/>
    <circle cx="139" cy="154" r="6" fill="#2ef58a" opacity=".35" filter="url(#glow)"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#2ef58a" stroke-opacity=".5" stroke-width="3"/>
</svg>
