# passport.io – Wächter für Lounge & Fast Track (alle 15 Minuten)
# Erinnert den Partner, warnt das Team bei überschrittener Frist und markiert verpasste Buchungen.
# Ruft nur die öffentliche, harmlose Funktion partner?tick=1 auf (tut nur etwas, wenn es fällig ist).
name: Lounge-Wächter

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_ENABLED == 'true' }}
    steps:
      - name: Wächter aufrufen
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ]; then echo "Supabase nicht verbunden."; exit 0; fi
          curl -sS --max-time 60 "https://$PROJECT_REF.supabase.co/functions/v1/partner?tick=1" || true
