# Prüft, welche Secrets in Supabase eingetragen sind – zeigt NUR die Namen, nie die Werte.
name: Secrets prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Namen der Supabase-Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | jq -r '.[].name' | sort | sed 's/^/SECRET: [/; s/$/]/'
      - name: Letzte Fehler der Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          SQL="select datetime(timestamp) as t, event_message from function_logs where event_message like '%eSIM%' or event_message like '%Error%' or event_message like '%error%' order by timestamp desc limit 25"
          START=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sfG -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs.all" \
            --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" \
            | jq -r '.result[]? | "LOG: \(.t) \(.event_message | gsub("\n"; " ") | .[0:400])"' || echo "LOG: Protokoll nicht lesbar"
