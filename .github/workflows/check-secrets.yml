# Prüft, welche Secrets in Supabase eingetragen sind – zeigt NUR die Namen, nie die Werte.
name: Secrets prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Namen der Supabase-Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | jq -r '.[].name' | sort | sed 's/^/SECRET: [/; s/$/]/'
