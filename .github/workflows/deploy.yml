# passport.io – automatische Veröffentlichung
# Bei jeder Änderung auf "main":
#   1. Webseite → GitHub Pages
#   2. Supabase-Funktionen + Datenbank-Änderungen → Supabase
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   (Supabase → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    (die Projekt-ID aus der Supabase-URL)
#   SUPABASE_DB_PASSWORD    (Datenbank-Passwort des Projekts)

name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  website:
    name: Webseite bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nur die öffentlichen Dateien einpacken
        env:
          # Eigene Domain später als Repository-Variable SITE_URL eintragen (z. B. https://passport.io/)
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir _site
          # Blog-Übersicht aus content/posts erzeugen, dazu sitemap.xml und robots.txt
          node tools/build-blog.js _site "${SITE_URL}"
          cp -r index.html install.html blog.html account.html page.html 404.html css js content img admin api _site/
          touch _site/.nojekyll
          # Versionsnummer anhängen, damit Besucher Änderungen sofort sehen
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i "s#css/styles.css\"#css/styles.css?v=$V\"#; s#js/app.js\"#js/app.js?v=$V\"#" _site/index.html _site/install.html _site/blog.html _site/account.html _site/page.html
      - name: Öffentliche Supabase-Angaben für das Kundenkonto (nur der öffentliche Schlüssel)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Supabase nicht verbunden – Kundenkonto bleibt aus."; exit 0; fi
          KEY=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            | jq -r '([.[] | select(.name=="anon")] + [.[] | select(.type=="publishable")]) | .[0].api_key // empty')
          if [ -z "$KEY" ]; then echo "Öffentlicher Schlüssel nicht gefunden – Kundenkonto bleibt aus."; exit 0; fi
          jq -n --arg url "https://$PROJECT_REF.supabase.co" --arg key "$KEY" '{url: $url, anonKey: $key}' > _site/content/auth.json
          echo "auth.json erstellt."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Eigener Schritt: GitHub findet das Paket zuverlässig erst nach Abschluss des Bau-Schritts
  pages:
    name: Webseite (GitHub Pages)
    needs: website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  supabase:
    name: Supabase (Funktionen & Datenbank)
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_ENABLED == 'true' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --linked --yes
      - name: Erlaubte Webadressen für die Funktionen setzen (nicht geheim)
        run: supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="https://${{ github.repository_owner }}.github.io,https://passport.io,https://www.passport.io,http://localhost:5173"
      - run: supabase functions deploy prices --no-verify-jwt --project-ref "$PROJECT_REF"
      - run: supabase functions deploy questions --no-verify-jwt --project-ref "$PROJECT_REF"
      # Konto: prüft die Anmeldung selbst (Token im Authorization-Header)
      - run: supabase functions deploy account --no-verify-jwt --project-ref "$PROJECT_REF"
      # Admin-Anmeldung (GitHub) für /admin
      - run: supabase functions deploy cms-auth --no-verify-jwt --project-ref "$PROJECT_REF"
      # Shop-Verwaltung (/admin/panel.html) – Zugriff nur für ADMIN_EMAILS
      - run: supabase functions deploy admin --no-verify-jwt --project-ref "$PROJECT_REF"
